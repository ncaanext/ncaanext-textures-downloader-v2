name: Build NEXT 27

on:
  push:
    branches: [next27]
  pull_request:
    branches: [next27]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: next27-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.name }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            args: --bundles nsis
          - name: macOS Universal
            os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
          - name: Linux x64
            os: ubuntu-22.04
            args: --bundles deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.os }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev git
      - run: npm ci
      - name: Build desktop app
        run: npm run tauri -- build --ci ${{ matrix.args }}
      - name: Package Windows portable app with MinGit
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $portableDir = Join-Path $env:RUNNER_TEMP 'next27-portable'
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item -LiteralPath 'src-tauri/target/release/ncaanext-textures-downloader.exe' -Destination $portableDir
          $gitResources = Join-Path $portableDir 'resources/mingit/x64'
          New-Item -ItemType Directory -Force -Path $gitResources | Out-Null
          Copy-Item -Path 'src-tauri/mingit/x64/*' -Destination $gitResources -Recurse
          Compress-Archive -Path "$portableDir/*" -DestinationPath 'next27-windows-x64-portable.zip'
      - name: Upload Windows packages
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: next27-windows-x64
          if-no-files-found: error
          path: |
            next27-windows-x64-portable.zip
            src-tauri/target/release/bundle/nsis/*.exe
      - name: Zip macOS app preserving permissions
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent 'src-tauri/target/universal-apple-darwin/release/bundle/macos/NCAA NEXT 27 Textures Downloader.app' next27-macos-universal.zip
      - name: Upload macOS packages
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: next27-macos-universal
          if-no-files-found: error
          path: |
            next27-macos-universal.zip
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
      - name: Upload Linux packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: next27-linux-x64
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
      - name: Upload resolved Cargo lockfile
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: next27-cargo-lock
          path: src-tauri/Cargo.lock

  android:
    name: Android ARM64 (experimental APK)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android NDK
        run: |
          sdkmanager "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android-arm64
      - run: npm ci
      - name: Generate Android project
        run: npm run tauri -- android init --ci --skip-targets-install
      - name: Build debug-signed test APK
        run: npm run tauri -- android build --ci --debug --apk --target aarch64
      - name: Upload experimental Android APK
        uses: actions/upload-artifact@v4
        with:
          name: next27-android-arm64-experimental
          if-no-files-found: error
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
